<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renderings &middot; Project Setup &middot; Menumaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://kit.fontawesome.com/da08280601.js" crossorigin="anonymous"></script>
</head>
<body>
<div class="app">

  <header class="app-bar">
    <h1 class="app-bar__title">Project Name</h1>
    <a class="app-bar__action" href="#">
      <i class="fa-regular fa-pen-to-square" aria-hidden="true"></i>
      Edit Default Menu
    </a>
  </header>

  <nav class="tab-bar" aria-label="Project setup sections">
    <a class="tab" href="index.html">General Info</a>
    <a class="tab is-active" href="renderings.html" aria-current="page">Renderings</a>
    <a class="tab" href="library.html">Library</a>
    <a class="tab" href="data.html">Data</a>
    <a class="tab" href="templates.html">Templates</a>
    <a class="tab" href="default-modifiers.html">Default Modifiers</a>
    <a class="tab" href="styles.html">Styles</a>
    <a class="tab" href="configuration.html">Configuration</a>
  </nav>

  <nav class="subtab-bar" aria-label="Section views">
    <a class="subtab is-active" href="renderings.html">Default</a>
    <a class="subtab" href="#">+ Rendering</a>
  </nav>

  <main class="page">
    <section class="well">
      <div class="grid grid--2">

        <div class="stack stack--lg">
          <div class="field">
            <label class="field__label">Name</label>
            <input type="text" class="input">
          </div>

          <div class="stack stack--sm">
            <h2 class="section-title">CSS</h2>
            <div class="row">
              <div class="field u-grow">
                <span class="field__label">File Name</span>
                <input type="text" class="input">
              </div>
              <button type="button" class="btn btn--info u-mt-4">
                <i class="fa-solid fa-pencil" aria-hidden="true"></i> Edit File
              </button>
              <button type="button" class="btn btn--success u-mt-4">
                <i class="fa-solid fa-plus" aria-hidden="true"></i> Add File
              </button>
            </div>
          </div>

          <div class="stack stack--sm">
            <h2 class="section-title">Autospacing</h2>
            <div class="choice-group">
              <label class="choice"><input type="radio" name="autospacing" checked><span>Manual</span></label>
              <label class="choice"><input type="radio" name="autospacing"><span>Automatic</span></label>
              <label class="choice"><input type="radio" name="autospacing"><span>Never</span></label>
            </div>
          </div>
        </div>

        <div class="stack stack--lg">
          <div class="stack stack--sm">
            <h2 class="section-title">PDF Rendering Options</h2>
            <div class="choice-group">
              <label class="choice"><input type="radio" name="validation" checked><span>Render without Validation Success</span></label>
              <label class="choice"><input type="radio" name="validation"><span>Render with Validation Success</span></label>
            </div>
          </div>

          <div class="grid grid--2">
            <div class="field">
              <label class="field__label">Web PDF Quality:</label>
              <div class="combo" data-combo="typeahead">
                <div class="combo__field">
                  <input type="text" class="combo__input" placeholder="Select an Option" role="combobox" aria-expanded="false" aria-autocomplete="list">
                </div>
                <i class="fa-solid fa-caret-down combo__caret" aria-hidden="true"></i>
              </div>
            </div>
            <div class="field">
              <label class="field__label">Low Res PDF Preset:</label>
              <div class="combo" data-combo="typeahead">
                <div class="combo__field">
                  <input type="text" class="combo__input" placeholder="Select an Option" role="combobox" aria-expanded="false" aria-autocomplete="list">
                </div>
                <i class="fa-solid fa-caret-down combo__caret" aria-hidden="true"></i>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="field u-grow">
              <span class="field__label">High Res PDF Preset:</span>
              <div class="combo" data-combo="typeahead">
                <div class="combo__field">
                  <input type="text" class="combo__input" placeholder="Select an Option" role="combobox" aria-expanded="false" aria-autocomplete="list">
                </div>
                <i class="fa-solid fa-caret-down combo__caret" aria-hidden="true"></i>
              </div>
            </div>
            <button type="button" class="btn btn--info u-mt-4">
              <i class="fa-solid fa-pencil" aria-hidden="true"></i> Edit
            </button>
          </div>
        </div>

        <div class="grid__divider"></div>

        <div class="stack">
          <div class="row row--between">
            <h2 class="section-title">Dimensions</h2>
            <div class="u-w-sm">
              <div class="combo" data-combo="typeahead">
                <div class="combo__field">
                  <input type="text" class="combo__input" placeholder="Select to Add Dimensions" role="combobox" aria-expanded="false" aria-autocomplete="list">
                </div>
                <i class="fa-solid fa-caret-down combo__caret" aria-hidden="true"></i>
              </div>
            </div>
          </div>

          <div class="dimensions">
            <div class="preset-list">
              <button type="button" class="preset">
                <span>Print</span>
                <span class="preset__remove" aria-hidden="true">
                  <i class="fa-solid fa-xmark"></i>
                </span>
              </button>
              <button type="button" class="preset is-active">Print</button>
              <button type="button" class="preset">Print Preview</button>
            </div>

            <div class="measure-grid">
              <span class="text-sm text-muted"></span>
              <span class="field__label">Measurement</span>
              <span class="field__label">Unit</span>

              <span class="measure-grid__label">Width</span>
              <input type="text" class="input">
              <div class="select">
                <select class="select__native">
                  <option selected>points</option>
                  <option>inches</option>
                  <option>millimeters</option>
                </select>
                <i class="fa-solid fa-chevron-down select__caret" aria-hidden="true"></i>
              </div>

              <span class="measure-grid__label">Height</span>
              <input type="text" class="input">
              <div class="select">
                <select class="select__native">
                  <option selected>points</option>
                  <option>inches</option>
                  <option>millimeters</option>
                </select>
                <i class="fa-solid fa-chevron-down select__caret" aria-hidden="true"></i>
              </div>

              <span class="measure-grid__label">DPI</span>
              <input type="text" class="input">
              <div class="select">
                <select class="select__native">
                  <option selected>points</option>
                  <option>inches</option>
                  <option>millimeters</option>
                </select>
                <i class="fa-solid fa-chevron-down select__caret" aria-hidden="true"></i>
              </div>
            </div>
          </div>
        </div>

        <div class="stack">
          <div class="row row--between">
            <h2 class="section-title">Skins</h2>
            <button type="button" class="btn btn--success">
              <i class="fa-solid fa-plus" aria-hidden="true"></i> Add Skin
            </button>
          </div>

          <div class="stack stack--sm">
            <div class="row">
              <span class="field__label u-grow">Name</span>
              <span class="field__label u-grow">Description</span>
              <span class="u-w-btn"></span>
            </div>
            <div class="row">
              <input type="text" class="input">
              <input type="text" class="input">
              <button type="button" class="btn btn--sm" aria-label="Remove skin"><i class="fa-regular fa-trash-can" aria-hidden="true"></i></button>
            </div>
            <div class="row">
              <input type="text" class="input">
              <input type="text" class="input">
              <button type="button" class="btn btn--sm" aria-label="Remove skin"><i class="fa-regular fa-trash-can" aria-hidden="true"></i></button>
            </div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer class="app-footer">
    <button type="button" class="btn">
      <i class="fa-regular fa-circle-xmark" aria-hidden="true"></i> Cancel Edits
    </button>
    <button type="button" class="btn btn--success">
      <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save Project
    </button>
  </footer>

</div>
<script src="js/app.js"></script>
</body>
</html>
