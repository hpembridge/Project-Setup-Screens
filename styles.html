<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Styles &middot; Project Setup &middot; Menumaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://kit.fontawesome.com/da08280601.js" crossorigin="anonymous"></script>
</head>
<body>
<div class="app">

  <header class="app-bar">
    <h1 class="app-bar__title">Project Name</h1>
    <a class="app-bar__action" href="#">
      <i class="fa-regular fa-pen-to-square" aria-hidden="true"></i>
      Edit Default Menu
    </a>
  </header>

  <nav class="tab-bar" aria-label="Project setup sections">
    <a class="tab" href="index.html">General Info</a>
    <a class="tab" href="renderings.html">Renderings</a>
    <a class="tab" href="library.html">Library</a>
    <a class="tab" href="data.html">Data</a>
    <a class="tab" href="templates.html">Templates</a>
    <a class="tab" href="default-modifiers.html">Default Modifiers</a>
    <a class="tab is-active" href="styles.html" aria-current="page">Styles</a>
    <a class="tab" href="configuration.html">Configuration</a>
  </nav>

  <main class="page">
    <section class="well">
      <div class="stack">
        <div class="search-bar">
          <label class="u-sr-only" for="q">Search Styles</label>
          <input type="search" id="q" class="input" placeholder="Search Styles">
          <button type="button" class="btn btn--success"><i class="fa-solid fa-plus" aria-hidden="true"></i> Add Style</button>
        </div>

        <table class="table">
          <thead>
            <tr>
              <th>Style Name</th>
              <th>Rendering Name</th>
              <th>Style Preview</th>
              <th class="col-narrow">Print</th>
              <th class="col-narrow">Digital</th>
              <th class="col-narrow">Default</th>
              <th class="col-actions"><span class="u-sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Limited</td>
              <td>Limited</td>
              <td><span class="table__thumb"><i class="fa-regular fa-image" aria-label="Style preview"></i></span></td>
              <td><i class="fa-solid fa-square-check table__check" aria-label="Yes"></i></td>
              <td></td>
              <td><i class="fa-solid fa-square-check table__check" aria-label="Yes"></i></td>
              <td class="col-actions"><div class="table__actions">
              <button type="button" class="btn btn--sm">Edit</button>
              <button type="button" class="btn btn--sm btn--danger">Delete</button>
            </div></td>
            </tr>
            <tr>
              <td>Full</td>
              <td>Full</td>
              <td><span class="table__thumb"><i class="fa-regular fa-image" aria-label="Style preview"></i></span></td>
              <td><i class="fa-solid fa-square-check table__check" aria-label="Yes"></i></td>
              <td><i class="fa-solid fa-square-check table__check" aria-label="Yes"></i></td>
              <td></td>
              <td class="col-actions"><div class="table__actions">
              <button type="button" class="btn btn--sm">Edit</button>
              <button type="button" class="btn btn--sm btn--danger">Delete</button>
            </div></td>
            </tr>
          </tbody>
        </table>

        <nav class="pagination" aria-label="Pagination">
          <a class="pagination__item" href="#">First</a>
          <a class="pagination__item" href="#" aria-label="Previous"><i class="fa-solid fa-angle-left" aria-hidden="true"></i></a>
          <a class="pagination__item is-active" href="#" aria-current="page">1</a>
          <a class="pagination__item" href="#" aria-label="Next"><i class="fa-solid fa-angle-right" aria-hidden="true"></i></a>
          <a class="pagination__item" href="#">Last</a>
        </nav>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <button type="button" class="btn">
      <i class="fa-regular fa-circle-xmark" aria-hidden="true"></i> Cancel Edits
    </button>
    <button type="button" class="btn btn--success">
      <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save Project
    </button>
  </footer>

</div>
<script src="js/app.js"></script>
</body>
</html>
