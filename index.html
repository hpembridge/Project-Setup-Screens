<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>General Info &middot; Project Setup &middot; Menumaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://kit.fontawesome.com/da08280601.js" crossorigin="anonymous"></script>
</head>
<body>
<div class="app">

  <header class="app-bar">
    <h1 class="app-bar__title">Project Name</h1>
    <a class="app-bar__action" href="#">
      <i class="fa-regular fa-pen-to-square" aria-hidden="true"></i>
      Edit Default Menu
    </a>
  </header>

  <nav class="tab-bar" aria-label="Project setup sections">
    <a class="tab is-active" href="index.html" aria-current="page">General Info</a>
    <a class="tab" href="renderings.html">Renderings</a>
    <a class="tab" href="library.html">Library</a>
    <a class="tab" href="data.html">Data</a>
    <a class="tab" href="templates.html">Templates</a>
    <a class="tab" href="default-modifiers.html">Default Modifiers</a>
    <a class="tab" href="styles.html">Styles</a>
    <a class="tab" href="configuration.html">Configuration</a>
  </nav>

  <main class="page">
    <section class="well">
      <div class="grid grid--3">

        <div class="stack">
          <div class="field">
            <label class="field__label">Project Name:</label>
            <input type="text" class="input" value="David Fai">
          </div>
          <div class="field">
            <label class="field__label">Project Description:</label>
            <textarea class="textarea">Mosby HR Training - Graffco</textarea>
          </div>
          <div class="field">
            <span class="field__label">Project Owner:</span>
            <div class="entity">
              <span>Cleveland Menu Test Account</span>
              <button type="button" class="entity__clear" data-clear-entity aria-label="Clear project owner"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="field">
            <label class="field__label">Sub Project Label:</label>
            <input type="text" class="input" value="Layout">
          </div>
          <div class="field">
            <label class="field__label">Open Date:</label>
            <div class="date">
              <input type="text" class="input" data-date value="09/14/2026">
              <button type="button" class="date__trigger" data-date-trigger aria-label="Choose date"><i class="fa-regular fa-calendar" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="field">
            <label class="field__label">Project Effective Date:</label>
            <div class="date">
              <input type="text" class="input" data-date value="09/14/2026" disabled>
              <button type="button" class="date__trigger" data-date-trigger disabled aria-label="Choose date"><i class="fa-regular fa-calendar" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="field">
            <label class="field__label">Close Date:</label>
            <div class="date">
              <input type="text" class="input" data-date value="11/27/2999">
              <button type="button" class="date__trigger" data-date-trigger aria-label="Choose date"><i class="fa-regular fa-calendar" aria-hidden="true"></i></button>
            </div>
          </div>
        </div>

        <div>
          <div class="choice-group">
            <label class="choice"><input type="checkbox" checked><span>Is Data Collection Project</span></label>
            <label class="choice"><input type="checkbox" checked><span>Enable Background Image Import</span></label>
            <label class="choice"><input type="checkbox" checked><span>Print Comparison Report on Job Ticket</span></label>
          </div>
          <div class="choice-group">
            <label class="choice"><input type="checkbox"><span>Hide Default Menus</span></label>
            <label class="choice"><input type="checkbox"><span>Allow Menu Templates</span></label>
            <label class="choice"><input type="checkbox"><span>Hide Default Menu if Template Assigned</span></label>
          </div>
          <div class="choice-group">
            <label class="choice"><input type="checkbox" checked><span>Error on 99.99 Prices</span></label>
            <label class="choice"><input type="checkbox" checked><span>Error on '###' Text</span></label>
            <label class="choice"><input type="checkbox"><span>Enforce Section Content Type</span></label>
            <label class="choice"><input type="checkbox"><span>Allow Users To Submit Menus With Broken Rules</span></label>
            <label class="choice"><input type="checkbox"><span>Images Count In Rule By Default</span></label>
          </div>
        </div>

        <div>
          <div class="choice-group">
            <label class="choice"><input type="checkbox"><span>Hide Edit Format Tab</span></label>
            <label class="choice"><input type="checkbox"><span>Hide Library Tab</span></label>
            <label class="choice"><input type="checkbox"><span>Hide Pages Pane Option</span></label>
          </div>
          <div class="choice-group">
            <label class="choice"><input type="checkbox"><span>Hide Advanced Tools</span></label>
            <label class="choice"><input type="checkbox"><span>Hide Cost Calculator</span></label>
            <label class="choice"><input type="checkbox"><span>Hide Feature Selector</span></label>
            <label class="choice"><input type="checkbox"><span>Hide Price Tier Selector</span></label>
          </div>
          <div class="choice-group">
            <label class="choice"><input type="checkbox"><span>Hide Menu Eyeball Icon</span></label>
            <label class="choice"><input type="checkbox"><span>Enable Hiding Calories</span></label>
            <label class="choice"><input type="checkbox"><span>Enable Hiding Prices</span></label>
          </div>
          <div class="choice-group">
            <label class="choice"><input type="checkbox"><span>CMP Approval</span></label>
            <label class="choice"><input type="checkbox"><span>Disable Mobile Menu Section Collapse</span></label>
            <label class="choice"><input type="checkbox"><span>Show Existing Menus on Product Details</span></label>
          </div>
        </div>

        <div class="grid__divider"></div>

        <div class="stack">
          <div class="field">
            <label class="field__label">Development Status:</label>
            <div class="select">
              <select class="select__native">
                <option></option>
                <option>In Development</option>
                <option>Approved</option>
                <option>Archived</option>
              </select>
              <i class="fa-solid fa-chevron-down select__caret" aria-hidden="true"></i>
            </div>
          </div>
          <div class="field">
            <label class="field__label">Default Item Sync Type:</label>
            <div class="select">
              <select class="select__native">
                <option selected>None</option>
                <option>Sync</option>
                <option>Sync and Overwrite</option>
              </select>
              <i class="fa-solid fa-chevron-down select__caret" aria-hidden="true"></i>
            </div>
          </div>
        </div>

        <div class="stack">
          <div class="field">
            <label class="field__label">Rendering Display Title:</label>
            <input type="text" class="input">
          </div>
          <div class="field">
            <label class="field__label">Rendering Sync Type:</label>
            <div class="select">
              <select class="select__native">
                <option selected>Sync</option>
                <option>None</option>
                <option>Manual</option>
              </select>
              <i class="fa-solid fa-chevron-down select__caret" aria-hidden="true"></i>
            </div>
          </div>
        </div>

        <div class="stack">
          <div class="field">
            <label class="field__label">High Res Hi Up Count:</label>
            <input type="text" class="input">
          </div>
          <div class="field">
            <label class="field__label">Publish Online Type:</label>
            <input type="text" class="input">
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer class="app-footer">
    <button type="button" class="btn">
      <i class="fa-regular fa-circle-xmark" aria-hidden="true"></i> Cancel Edits
    </button>
    <button type="button" class="btn btn--success">
      <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save Project
    </button>
  </footer>

</div>
<script src="js/app.js"></script>
</body>
</html>
