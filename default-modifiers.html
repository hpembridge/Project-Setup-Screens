<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://kit.fontawesome.com/da08280601.js" crossorigin="anonymous"></script>

<body>
<div class="app">

  <header class="app-bar">
    <h1 class="app-bar__title">Project Name</h1>
    <a class="app-bar__action" href="#">
      <i class="fa-regular fa-pen-to-square" aria-hidden="true"></i>
      Edit Default Menu

  <nav class="tab-bar" aria-label="Project setup sections">
    <a class="tab" href="index.html">General Info</a>
    <a class="tab" href="renderings.html">Renderings</a>

  <main class="page">
    <section class="well">
      <div class="stack">
        <div class="search-bar">
          <label class="u-sr-only" for="q">Search Default Modifiers</label>
          <input type="search" id="q" class="input" placeholder="Search Default Modifiers">
          <button type="button" class="btn btn--success"><i class="fa-solid fa-plus" aria-hidden="true"></i> Add Default</button>
        </div>
        <div class="card">
          <div class="grid grid--4">
            <div class="field">
              <label class="field__label">Template</label>
              <div class="combo" data-combo="typeahead">
                <div class="combo__field">
                  <input type="text" class="combo__input" placeholder="Select an Option" role="combobox" aria-expanded="false" aria-autocomplete="list">
                </div>
                <i class="fa-solid fa-caret-down combo__caret" aria-hidden="true"></i>
              </div>
            </div>
            <div class="field">
              <label class="field__label">Match Type</label>
              <div class="combo" data-combo="typeahead">
                <div class="combo__field">
                  <input type="text" class="combo__input" placeholder="Select an Option" role="combobox" aria-expanded="false" aria-autocomplete="list">
                </div>
                <i class="fa-solid fa-caret-down combo__caret" aria-hidden="true"></i>
              </div>
            </div>
            <div class="field">
              <label class="field__label">Match Field</label>
              <div class="combo" data-combo="typeahead">
                <div class="combo__field">
                  <input type="text" class="combo__input" placeholder="Select an Option" role="combobox" aria-expanded="false" aria-autocomplete="list">

                <i class="fa-solid fa-caret-down combo__caret" aria-hidden="true"></i>
              </div>
            </div>
            <div class="row">
              <div class="field u-grow">
                <span class="field__label">Base</span>
                <div class="combo" data-combo="typeahead">
                  <div class="combo__field">
                    <input type="text" class="combo__input" placeholder="Select an Option" role="combobox" aria-expanded="false" aria-autocomplete="list">
                  </div>
                  <i class="fa-solid fa-caret-down combo__caret" aria-hidden="true"></i>
                </div>
              </div>
              <button type="button" class="btn btn--danger u-mt-4">Delete</button>
            </div>
          </div>

          <div class="field u-mt-3">
            <span class="field__label">Modifiers</span>
            <div class="combo" data-combo="multiselect">
              <div class="combo__field">
                <span class="chip">1 cup<button type="button" class="chip__menu" aria-label="Options for 1 cup"><i class="fa-solid fa-caret-down" aria-hidden="true"></i></button></span>
                <span class="chip">Cleveland Menu Test Images<button type="button" class="chip__menu" aria-label="Options for Cleveland Menu Test Images"><i class="fa-solid fa-caret-down" aria-hidden="true"></i></button></span>
                <input type="text" class="combo__input" placeholder="" role="combobox" aria-expanded="false" aria-autocomplete="list">
              </div>
              <i class="fa-solid fa-caret-down combo__caret" aria-hidden="true"></i>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="grid grid--4">
            <div class="field">
              <label class="field__label">Template</label>
              <div class="combo" data-combo="typeahead">
                <div class="combo__field">
                  <input type="text" class="combo__input" placeholder="Select an Option" role="combobox" aria-expanded="false" aria-autocomplete="list">
                </div>
                <i class="fa-solid fa-caret-down combo__caret" aria-hidden="true"></i>
              </div>
            </div>
            <div class="field">
              <label class="field__label">Match Type</label>
              <div class="combo" data-combo="typeahead">
                <div class="combo__field">
                  <input type="text" class="combo__input" placeholder="Select an Option" role="combobox" aria-expanded="false" aria-autocomplete="list">

            </div>

              <label class="field__label">Match Field</label>
              <div class="combo" data-combo="typeahead">
                <div class="combo__field">
                  <input type="text" class="combo__input" placeholder="Select an Option" role="combobox" aria-expanded="false" aria-autocomplete="list">
                </div>
                <i class="fa-solid fa-caret-down combo__caret" aria-hidden="true"></i>
              </div>
            </div>
            <div class="row">
              <div class="field u-grow">
                <span class="field__label">Base</span>
                <div class="combo" data-combo="typeahead">
                  <div class="combo__field">
                    <input type="text" class="combo__input" placeholder="Select an Option" role="combobox" aria-expanded="false" aria-autocomplete="list">
                  </div>
                  <i class="fa-solid fa-caret-down combo__caret" aria-hidden="true"></i>
                </div>
              </div>
              <button type="button" class="btn btn--danger u-mt-4">Delete</button>
            </div>
          </div>

          <div class="field u-mt-3">
            <span class="field__label">Modifiers</span>
            <div class="combo" data-combo="multiselect">
              <div class="combo__field">
                <span class="chip">Cleveland Menu Test Food<button type="button" class="chip__menu" aria-label="Options for Cleveland Menu Test Food"><i class="fa-solid fa-caret-down" aria-hidden="true"></i></button></span>
                <span class="chip">Cleveland Menu Test Images<button type="button" class="chip__menu" aria-label="Options for Cleveland Menu Test Images"><i class="fa-solid fa-caret-down" aria-hidden="true"></i></button></span>
                <input type="text" class="combo__input" placeholder="" role="combobox" aria-expanded="false" aria-autocomplete="list">
              </div>
              <i class="fa-solid fa-caret-down combo__caret" aria-hidden="true"></i>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <button type="button" class="btn">
      <i class="fa-regular fa-circle-xmark" aria-hidden="true"></i> Cancel Edits
    </button>
    <button type="button" class="btn btn--success">
      <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save Project
    </button>
  </footer>

<script src="js/app.js"></script>
